name: Backend Deploy

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript syntax
        run: |
          find . \
            -path './node_modules' -prune -o \
            -path './.git' -prune -o \
            -name '*.js' -type f -print0 \
            | xargs -0 -n1 node --check

      - name: Verify Vercel configuration
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$VERCEL_TOKEN" ]] || { echo "VERCEL_TOKEN is not configured"; exit 1; }
          [[ -n "$VERCEL_ORG_ID" ]] || { echo "VERCEL_ORG_ID is not configured"; exit 1; }
          [[ -n "$VERCEL_PROJECT_ID" ]] || { echo "VERCEL_PROJECT_ID is not configured"; exit 1; }

      - name: Pull Vercel production configuration
        run: npx vercel@latest pull --yes --environment=production --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID"

      - name: Build Vercel deployment artifact
        run: npx vercel@latest build --prod --token "$VERCEL_TOKEN"

      - name: Deploy to Vercel
        run: npx vercel@latest deploy --prebuilt --prod --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID"
