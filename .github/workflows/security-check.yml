name: Security Check

on:
  push:
  pull_request:

jobs:
  scan-repository:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reject tracked environment files
        shell: bash
        run: |
          set -euo pipefail
          tracked_env_files=$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '^\.env\.example$' || true)
          if [[ -n "$tracked_env_files" ]]; then
            echo "Tracked environment files are not allowed:"
            echo "$tracked_env_files"
            exit 1
          fi

      - name: Scan tracked files for credentials
        shell: bash
        run: |
          set -euo pipefail
          matches=$(git grep -n -I -E \
            'mongodb\+srv://[^<[:space:]]+:[^<[:space:]]+@|-----BEGIN [A-Z ]*PRIVATE KEY-----|\b(AKIA|ASIA)[0-9A-Z]{16}\b|\b(rzp|sk)_(live|test)_[A-Za-z0-9]+\b' \
            -- ':!package-lock.json' ':!.env.example' || true)

          if [[ -n "$matches" ]]; then
            echo "Potential credentials found in tracked files:"
            echo "$matches"
            exit 1
          fi
